<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Rush</title>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="app-body" x-data="game()" x-init="initGame()">

    <!-- Main Game Container -->
    <div class="game-container">

        <div class="main-screen">
            <!-- Header / Stats -->
            <header class="game-header">
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span class="score-value" x-text="score" x-transition></span>
                </div>

                <div class="timer-box">
                    <div class="timer-value" x-text="formatTime(timeLeft)"></div>
                </div>

                <div class="stat-box align-end">
                    <span class="stat-label">Best</span>
                    <span class="highscore-value" x-text="highScore"></span>
                </div>
            </header>

            <!-- Word Preview & Category -->
            <section class="word-preview-section">
                <!-- Current Drag Selection -->
                <div class="current-word-container">
                    <div class="current-word-display" :class="{
                        'valid': isValidWord,
                        'invalid': !isValidWord && currentWord.length > 0
                      }">
                        <span x-text="currentWord || '&nbsp;'"></span>
                    </div>
                </div>

                <!-- Mode Switcher Buttons -->
                <div class="mode-controls">
                    <button @click="setMode('standard')" class="mode-btn"
                        :class="{ 'active': gameMode === 'standard' }">
                        Standard
                    </button>
                    <button @click="setMode('destructive')" class="mode-btn destructive"
                        :class="{ 'active': gameMode === 'destructive' }">
                        Destructive
                    </button>
                </div>

                <!-- Word Category Popover -->
                <transition name="fade">
                    <div x-show="lastWordCategory" class="category-badge" :class="lastWordCategory"
                        x-text="lastWordCategory">
                    </div>
                </transition>
            </section>

            <!-- The Grid -->
            <main class="grid-wrapper" @touchstart.prevent="handleTouchStart" @touchmove.prevent="handleTouchMove"
                @touchend.prevent="handleTouchEnd" @mousedown.prevent="handleMouseDown"
                @mousemove.prevent="handleMouseMove" @mouseup.prevent="handleMouseUp" @mouseleave="handleMouseUp">

                <div class="game-grid" :style="{ '--grid-cols': width, '--grid-rows': height }">
                    <template x-for="(cell, index) in grid" :key="cell.id">
                        <div class="tile" :class="getCellClasses(cell)" :data-index="index">
                            <span x-text="cell.letter"></span>
                        </div>
                    </template>
                </div>
            </main>
        </div>

        <!-- Found Words List -->
        <section class="found-words-section">
            <h3 class="section-title">Found Words</h3>
            <div class="found-words-list">
                <template x-for="(item, idx) in validWordsHistory.slice().reverse()" :key="idx">
                    <span class="found-word-tag" :class="item.category" x-text="item.word"></span>
                </template>
            </div>
        </section>

    </div>

    <!-- Game Over Modal -->
    <div x-show="gameOver" style="display: none;" class="modal-overlay" x-transition.opacity>
        <div class="modal-content">
            <h1 class="modal-title">Time's Up!</h1>
            <p class="modal-score">Final Score: <span class="final-score" x-text="score"></span></p>

            <div class="modal-actions">
                <button @click="restartGame('destructive')" class="action-btn destructive-gradient">
                    Destructive Mode
                </button>
                <button @click="restartGame('standard')" class="action-btn standard-gradient">
                    Standard Mode
                </button>
            </div>
        </div>
    </div>

    <!-- Load Dictionary & Game Logic -->
    <script src="dictionary.js"></script>
    <script src="themes/sample-theme.js"></script>
    <script src="app.js"></script>
</body>

</html>
