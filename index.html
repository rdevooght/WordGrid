<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Rush</title>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="app-body" x-data="game()" x-init="initGame()">
    <!-- Main Game Container -->
    <div class="game-container">
        <div class="main-screen">
            <!-- Header / Stats -->
            <header class="game-header">
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span class="score-value" x-text="score" x-transition></span>
                </div>

                <div class="timer-box">
                    <div class="timer-value" x-text="formatTime(timeLeft)"></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- The Grid -->
                <div class="grid-wrapper" @touchstart.prevent="handleTouchStart" @touchmove.prevent="handleTouchMove"
                    @touchend.prevent="handleTouchEnd" @mousedown.prevent="handleMouseDown"
                    @mousemove.prevent="handleMouseMove" @mouseup.prevent="handleMouseUp" @mouseleave="handleMouseUp">
                    <div class="game-grid" :style="{ '--grid-cols': width, '--grid-rows': height }">
                        <template x-for="(cell, index) in grid" :key="cell.id">
                            <div class="tile" :class="getCellClasses(cell)" :data-index="index">
                                <span x-text="cell.letter"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Side Panel (Right on Desktop, Bottom on Mobile) -->
                <div class="side-panel">
                    <!-- Theme Words Panel -->
                    <aside class="theme-words-panel" x-show="gameMode === 'theme'" x-cloak>
                        <div class="panel-header">
                            <h3 class="panel-title">Theme Words</h3>
                            <span class="theme-count" x-text="`${foundThemeWords.length}/${totalThemeWords}`"></span>
                        </div>
                        <div class="theme-list">
                            <template x-for="word in foundThemeWords" :key="word">
                                <span class="found-word-tag legendary" x-text="word"></span>
                            </template>
                            <div x-show="foundThemeWords.length === 0" class="empty-state">
                                Find theme words!
                            </div>
                        </div>
                    </aside>

                    <!-- Found Words List -->
                    <section class="found-words-section">
                        <h3 class="section-title">Found Words</h3>
                        <div class="found-words-list">
                            <template x-for="(item, idx) in validWordsHistory.slice().reverse()" :key="idx">
                                <span class="found-word-tag" :class="item.category" x-text="item.word"></span>
                            </template>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div x-show="gameOver" style="display: none" class="modal-overlay" x-transition.opacity>
        <div class="modal-content">
            <h1 class="modal-title">Time's Up!</h1>
            <p class="modal-score">
                Final Score:
                <span class="final-score" x-text="score"></span>
            </p>

            <div class="modal-actions">
                <button @click="restartGame('destructive')" class="action-btn destructive-gradient">
                    Destructive Mode
                </button>
                <button @click="restartGame('standard')" class="action-btn standard-gradient">
                    Standard Mode
                </button>
            </div>
        </div>
    </div>

    <!-- Load Dictionary & Game Logic -->
    <script src="dictionary.js"></script>
    <script src="themes/20251222.js"></script>
    <script src="app.js"></script>
</body>

</html>
