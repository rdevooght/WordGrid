<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Grid</title>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="app-body" x-data="game()" x-init="initGame()">
    <!-- Main Game Container -->
    <div class="game-container">
        <div class="main-screen">
            <!-- Header / Stats -->
            <header class="game-header">
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span class="score-value" x-text="score" x-transition></span>
                </div>

                <div class="timer-box">
                    <div class="timer-value" x-text="formatTime(timeLeft)"></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Main Column (Grid + Actions) -->
                <div class="game-main-column">
                    <!-- The Grid -->
                    <div class="grid-wrapper" @touchstart.prevent="handleTouchStart"
                        @touchmove.prevent="handleTouchMove" @touchend.prevent="handleTouchEnd"
                        @mousedown.prevent="handleMouseDown" @mousemove.prevent="handleMouseMove"
                        @mouseup.prevent="handleMouseUp" @mouseleave="handleMouseUp">
                        <!-- Start Screen Overlay -->
                        <div class="overlay start-overlay" x-show="!gameStarted && !gameOver" x-transition.opacity>
                            <div class="overlay-content">
                                <h2 class="overlay-title">Today's Theme</h2>
                                <h1 class="theme-name" x-text="themeName"></h1>
                                <p class="theme-info" x-text="`(${totalThemeWords} words)`"></p>

                                <div class="time-info">
                                    <span class="label">Available time</span>
                                    <span class="value" x-text="formatTime(timeLeft)"></span>
                                </div>

                                <button class="start-btn pulse-animation">
                                    Click/tap to start !
                                </button>
                            </div>
                        </div>

                        <!-- End Screen Overlay (Scoped to Grid) -->
                        <div class="overlay end-overlay" x-show="gameOver" style="display: none" x-transition.opacity>
                            <div class="overlay-content">
                                <h2 class="overlay-title">Time's Up!</h2>

                                <div class="results-box">
                                    <p>You found <span class="highlight" x-text="foundThemeWords.length"></span> of the
                                        <span x-text="totalThemeWords"></span> theme words
                                    </p>
                                    <p>You found <span class="highlight" x-text="validWordsHistory.length"></span> extra
                                        words</p>
                                    <p class="score-line">Score: <span class="score-val" x-text="score"></span></p>
                                </div>

                                <p class="come-back-msg">Come back tomorrow for another grid !</p>
                            </div>
                        </div>

                        <svg class="path-overlay" :viewBox="`0 0 ${pathViewBox.width} ${pathViewBox.height}`">
                            <polyline class="selection-path" :points="getPathPoints()" fill="none" />
                        </svg>
                        <div class="game-grid" :style="{ '--grid-cols': width, '--grid-rows': height }">
                            <template x-for="(cell, index) in grid" :key="cell.id">
                                <div class="tile" :class="getCellClasses(cell)" :data-index="index">
                                    <span x-text="cell.letter"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Action Bar -->
                    <div class="action-bar">
                        <!-- Mana Display -->
                        <div class="mana-display">
                            <div class="mana-bar">
                                <div class="mana-fill" :style="{ width: (mana / maxMana * 100) + '%' }"></div>
                            </div>
                            <span class="mana-text" x-text="mana + '/' + maxMana"></span>
                        </div>

                        <!-- Ability Buttons Row -->
                        <div class="ability-buttons">
                            <template x-for="ability in abilitiesList" :key="ability.id">
                                <button class="ability-btn" :class="{
                                        [ability.id]: true,
                                        'enabled': $data[ability.condition],
                                        'active': ability.activeMode && activeAbility === ability.activeMode
                                    }" :disabled="!$data[ability.condition]" @click="$data[ability.action]()"
                                    :title="ability.name">
                                    <span class="btn-icon" x-text="ability.icon"></span>
                                    <span class="btn-cost" x-show="ability.cost > 0" x-text="ability.cost"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Side Panel (Right on Desktop, Bottom on Mobile) -->
                <div class="side-panel">
                    <!-- Theme Words Panel -->
                    <aside class="theme-words-panel" x-show="gameMode === 'theme'"
                        :class="{ 'success': allThemeWordsFound }" x-cloak>
                        <div class="panel-header">
                            <h3 class="panel-title">Theme Words</h3>
                            <span class="theme-count" x-text="`${foundThemeWords.length}/${totalThemeWords}`"></span>
                        </div>
                        <div class="theme-list">
                            <template x-for="word in foundThemeWords" :key="word">
                                <span class="found-word-tag legendary" x-text="word"></span>
                            </template>

                            <!-- Missing Theme Words Header -->
                            <div x-show="missingThemeWords.length > 0" class="missing-header">
                                You missed:
                            </div>

                            <!-- Missing Theme Words (Only shown when Game Over) -->
                            <template x-for="word in missingThemeWords" :key="word">
                                <span class="found-word-tag missing" x-text="word"></span>
                            </template>

                            <div x-show="foundThemeWords.length === 0 && !gameOver" class="empty-state">
                                Find theme words!
                            </div>
                        </div>
                    </aside>

                    <!-- Found Words List -->
                    <section class="found-words-section">
                        <h3 class="section-title">Found Words</h3>
                        <div class="found-words-list">
                            <template x-for="(item, idx) in validWordsHistory.slice().reverse()" :key="idx">
                                <span class="found-word-tag" :class="item.category" x-text="item.word"></span>
                            </template>
                        </div>
                    </section>
                </div>
            </div>
        </div>


        <!-- Toast Notification -->
        <div class="toast-notification" :class="{ 'show': showToast }" x-text="toastMessage"></div>

        <!-- Load Dictionary & Game Logic -->
        <script src="dictionary.js"></script>
        <script src="themes/20251222.js"></script>
        <script src="app.js"></script>
</body>

</html>
